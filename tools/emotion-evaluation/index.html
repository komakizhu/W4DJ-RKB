<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>W4DJ 情绪模型验收</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">W4DJ RKB · OFFLINE EVALUATION</p>
        <h1>情绪模型主观验收</h1>
        <p class="lede">同一首歌、同一个 10 秒片段，匿名比较旧 Mood 基线、emoMusic、MuSe 和 MIREX。</p>
      </header>

      <section id="setup" class="panel">
        <h2>1. 加载验收批次</h2>
        <div class="file-row">
          <label class="file-button">选择 manifest
            <input id="manifest-input" type="file" accept="application/json,.json" />
          </label>
          <label class="file-button">选择输出音频文件夹
            <input id="audio-input" type="file" webkitdirectory directory multiple />
          </label>
        </div>
        <p id="setup-status" class="muted">请先选择 manifest 和输出音频文件夹。</p>
        <button id="start-button" class="primary" disabled>开始验收</button>
        <button id="resume-button" class="secondary" hidden>恢复上次进度</button>
      </section>

      <section id="evaluation" class="panel" hidden>
        <div class="progress-line">
          <span id="progress-text"></span>
          <div class="file-row">
            <button id="previous-button" class="small secondary" disabled>上一首</button>
            <button id="pause-button" class="small secondary">暂停</button>
          </div>
        </div>
        <div class="track-heading">
          <p class="eyebrow">当前片段</p>
          <h2 id="track-title"></h2>
          <p id="track-artist" class="muted"></p>
          <p id="track-path" class="path"></p>
          <audio id="audio-player" controls preload="metadata"></audio>
          <p id="audio-status" class="muted"></p>
        </div>

        <div id="human-stage" class="stage">
          <h3>先选择你听到的主情绪</h3>
          <p class="muted">此时不会显示任何模型结果。</p>
          <div id="human-options" class="choice-grid"></div>
          <button id="human-submit" class="primary" disabled>继续查看模型结果</button>
        </div>

        <div id="model-stage" class="stage" hidden>
          <h3>哪个结果最符合你的听感？</h3>
          <p class="muted">卡片顺序随机，真实模型名称在本页隐藏。</p>
          <div id="model-cards" class="card-grid"></div>
          <div class="model-actions">
            <button id="tie-button" class="secondary">并列</button>
            <button id="none-button" class="secondary">都不符合</button>
            <button id="model-submit" class="primary" disabled>提交本首</button>
          </div>
        </div>
      </section>

      <section id="summary" class="panel" hidden>
        <h2>验收汇总</h2>
        <pre id="summary-output"></pre>
        <div class="file-row">
          <button id="edit-last-button" class="secondary">修改上一首</button>
          <button id="export-json" class="primary">导出 JSON</button>
          <button id="export-csv" class="secondary">导出 CSV</button>
        </div>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
