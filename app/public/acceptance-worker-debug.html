<!doctype html><meta charset="utf-8"><pre id="result">starting</pre>
<script type="module">
const result = document.querySelector('#result');
const events = [];
const worker = new Worker('/src/analysis.worker.ts', { type: 'module' });
worker.onmessage = (event) => { events.push({ type: 'message', data: event.data }); result.textContent = JSON.stringify(events); };
worker.onerror = (event) => { events.push({ type: 'error', message: event.message, filename: event.filename, line: event.lineno }); result.textContent = JSON.stringify(events); };
worker.postMessage({ type: 'start', jobId: 'debug', models: [] });
setTimeout(() => { result.textContent = JSON.stringify(events); worker.terminate(); }, 10000);
</script>
