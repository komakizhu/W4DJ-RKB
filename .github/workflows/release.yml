name: Release W4DJ

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--bundles dmg'
            asset_name_prefix: 'W4DJ-RKB-macOS-Apple-Silicon-v'
            asset_extension: '[ext]'
          - platform: 'macos-15-intel'
            args: '--bundles dmg'
            asset_name_prefix: 'W4DJ-RKB-macOS-Intel-v'
            asset_extension: '[ext]'
          - platform: 'windows-latest'
            args: '--bundles nsis'
            asset_name_prefix: 'W4DJ-RKB-Windows-Installer-v'
            asset_extension: '[setup][ext]'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        working-directory: ./app
        run: npm ci

      - name: Build Frontend
        working-directory: ./app
        run: npm run build

      - name: Create binaries directory (macOS)
        if: runner.os == 'macOS'
        run: mkdir -p src-tauri/binaries

      - name: Create binaries directory (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null

      - name: Download ffmpeg sidecar (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -L -o src-tauri/binaries/ffmpeg-aarch64-apple-darwin https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-darwin-arm64
          curl -L -o src-tauri/binaries/ffmpeg-x86_64-apple-darwin https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-darwin-x64
          chmod +x src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          chmod +x src-tauri/binaries/ffmpeg-x86_64-apple-darwin

      - name: Download ffmpeg sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-win32-x64" -OutFile "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"

      - name: Select release variant
        id: variant
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            *-legacy)
              echo 'tauri_args=-- --no-default-features --features legacy' >> "$GITHUB_OUTPUT"
              echo 'config_args=--config src-tauri/tauri.legacy.conf.json' >> "$GITHUB_OUTPUT"
              echo 'asset_suffix=-Legacy' >> "$GITHUB_OUTPUT"
              echo 'app_name=W4DJ RKB Legacy' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'tauri_args=' >> "$GITHUB_OUTPUT"
              echo 'config_args=' >> "$GITHUB_OUTPUT"
              echo 'asset_suffix=' >> "$GITHUB_OUTPUT"
              echo 'app_name=W4DJ RKB' >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Prepare release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(awk -v version="$version" '
            $0 == "## v" version { found=1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "$notes" ]; then
            echo "未找到 v$version 的更新日志章节" >&2
            exit 1
          fi
          {
            echo 'RELEASE_BODY<<EOF'
            echo "$notes"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Build and Package Tauri App
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'W4DJ ${{ github.ref_name }}'
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }} ${{ steps.variant.outputs.config_args }} ${{ steps.variant.outputs.tauri_args }}
          releaseAssetNamePattern: '${{ matrix.asset_name_prefix }}[version]${{ steps.variant.outputs.asset_suffix }}${{ matrix.asset_extension }}'

      - name: Add macOS Gatekeeper repair helper to DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dmg="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then
            echo "找不到待处理的 DMG" >&2
            exit 1
          fi

          helper='packaging/macos/解决文件已损坏问题（双击）.command'
          workdir="$(mktemp -d)"
          rw_image="$workdir/w4dj-rw.dmg"
          mountpoint="$workdir/mount"
          app_name='${{ steps.variant.outputs.app_name }}'
          mkdir -p "$mountpoint"

          hdiutil convert "$dmg" -format UDRW -o "$rw_image"
          hdiutil attach "$rw_image" -mountpoint "$mountpoint" -nobrowse -noautoopen
          cp "$helper" "$mountpoint/解决文件已损坏问题（双击）.command"
          chmod +x "$mountpoint/解决文件已损坏问题（双击）.command"
          osascript <<APPLESCRIPT
          tell application "Finder"
            tell folder (POSIX file "$mountpoint" as alias)
              set bounds of container window to {100, 100, 900, 600}
              set current view of container window to icon view
              set icon size of icon view options of container window to 128
              set arrangement of icon view options of container window to not arranged
              set position of item "${app_name}.app" to {150, 240}
              set position of item "解决文件已损坏问题（双击）.command" to {410, 240}
              set position of item "Applications" to {670, 240}
              close
            end tell
          end tell
          APPLESCRIPT
          hdiutil detach "$mountpoint"

          rebuilt="$workdir/w4dj-final.dmg"
          hdiutil convert "$rw_image" -format UDZO -o "$rebuilt"

          verify_mount="$workdir/verify-mount"
          mkdir -p "$verify_mount"
          hdiutil attach "$rebuilt" -mountpoint "$verify_mount" -nobrowse -noautoopen
          if [[ ! -d "$verify_mount/$app_name.app" ]]; then
            echo "最终 DMG 缺少 $app_name.app" >&2
            exit 1
          fi
          if [[ ! -x "$verify_mount/解决文件已损坏问题（双击）.command" ]]; then
            echo "最终 DMG 缺少可执行的 Gatekeeper 修复工具" >&2
            exit 1
          fi
          if [[ ! -L "$verify_mount/Applications" && ! -d "$verify_mount/Applications" ]]; then
            echo "最终 DMG 缺少 Applications 链接或目录" >&2
            exit 1
          fi
          hdiutil detach "$verify_mount"

          mv "$rebuilt" "$dmg"

          version="${GITHUB_REF_NAME#v}"
          version="${version%-legacy}"
          asset_name='${{ matrix.asset_name_prefix }}[version]${{ steps.variant.outputs.asset_suffix }}${{ matrix.asset_extension }}'
          asset_name="${asset_name//\[version\]/$version}"
          asset_name="${asset_name//\[ext\]/.dmg}"
          renamed_dmg="$workdir/$asset_name"
          mv "$dmg" "$renamed_dmg"
          gh release upload "$GITHUB_REF_NAME" "$renamed_dmg" --clobber
