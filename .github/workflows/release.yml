name: Release W4DJ

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--bundles dmg'
            asset_name: 'W4DJ-RKB-macOS-Apple-Silicon-v[version][ext]'
          - platform: 'macos-15-intel'
            args: '--bundles dmg'
            asset_name: 'W4DJ-RKB-macOS-Intel-v[version][ext]'
          - platform: 'windows-latest'
            args: '--bundles nsis'
            asset_name: 'W4DJ-RKB-Windows-Installer-v[version][setup][ext]'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        working-directory: ./app
        run: npm ci

      - name: Build Frontend
        working-directory: ./app
        run: npm run build

      - name: Create binaries directory (macOS)
        if: runner.os == 'macOS'
        run: mkdir -p src-tauri/binaries

      - name: Create binaries directory (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null

      - name: Download ffmpeg sidecar (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -L -o src-tauri/binaries/ffmpeg-aarch64-apple-darwin https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-darwin-arm64
          curl -L -o src-tauri/binaries/ffmpeg-x86_64-apple-darwin https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-darwin-x64
          chmod +x src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          chmod +x src-tauri/binaries/ffmpeg-x86_64-apple-darwin

      - name: Download ffmpeg sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-win32-x64" -OutFile "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"

      - name: Prepare release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(awk -v version="$version" '
            $0 == "## v" version { found=1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "$notes" ]; then
            echo "未找到 v$version 的更新日志章节" >&2
            exit 1
          fi
          {
            echo 'RELEASE_BODY<<EOF'
            echo "$notes"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Build and Package Tauri App
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'W4DJ ${{ github.ref_name }}'
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          releaseAssetNamePattern: ${{ matrix.asset_name }}

      - name: Add macOS Gatekeeper repair helper to DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dmg="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then
            echo "找不到待处理的 DMG" >&2
            exit 1
          fi

          helper='packaging/macos/解决文件已损坏问题（双击）.command'
          workdir="$(mktemp -d)"
          rw_image="$workdir/w4dj-rw.dmg"
          mountpoint="$workdir/mount"
          mkdir -p "$mountpoint"

          hdiutil convert "$dmg" -format UDRW -o "$rw_image"
          hdiutil attach "$rw_image" -mountpoint "$mountpoint" -nobrowse -noautoopen
          cp "$helper" "$mountpoint/解决文件已损坏问题（双击）.command"
          chmod +x "$mountpoint/解决文件已损坏问题（双击）.command"
          osascript <<APPLESCRIPT
          tell application "Finder"
            tell folder (POSIX file "$mountpoint" as alias)
              set bounds of container window to {100, 100, 900, 600}
              set current view of container window to icon view
              set icon size of icon view options of container window to 128
              set arrangement of icon view options of container window to not arranged
              set position of item "W4DJ RKB.app" to {150, 240}
              set position of item "解决文件已损坏问题（双击）.command" to {410, 240}
              set position of item "Applications" to {670, 240}
              close
            end tell
          end tell
          APPLESCRIPT
          hdiutil detach "$mountpoint"

          rebuilt="$workdir/w4dj-final.dmg"
          hdiutil convert "$rw_image" -format UDZO -o "$rebuilt"
          mv "$rebuilt" "$dmg"

          final_mountpoint="$workdir/final-mount"
          mkdir -p "$final_mountpoint"
          hdiutil attach "$dmg" -mountpoint "$final_mountpoint" -nobrowse -noautoopen -readonly
          test -d "$final_mountpoint/W4DJ RKB.app"
          test -x "$final_mountpoint/解决文件已损坏问题（双击）.command"
          test -e "$final_mountpoint/Applications"
          hdiutil detach "$final_mountpoint"

          version="${GITHUB_REF_NAME#v}"
          asset_name='${{ matrix.asset_name }}'
          asset_name="${asset_name//\[version\]/$version}"
          asset_name="${asset_name//\[ext\]/.dmg}"
          renamed_dmg="$workdir/$asset_name"
          mv "$dmg" "$renamed_dmg"
          gh release upload "$GITHUB_REF_NAME" "$renamed_dmg" --clobber

      - name: Normalize Windows installer asset
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter *.exe | Select-Object -First 1
          if ($null -eq $exe) {
            throw "找不到 Windows 安装包"
          }
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $assetName = "W4DJ-RKB-Windows-Installer-v$version-setup.exe"
          $renamed = Join-Path $env:RUNNER_TEMP $assetName
          Copy-Item $exe.FullName $renamed -Force
          gh release upload $env:GITHUB_REF_NAME $renamed --clobber
